<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Store | OblakoTeam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">Sky Store <span class="accent">OblakoTeam</span></div>
        <nav class="nav">
            <a href="#catalog">Каталог</a>
            <a href="#about">О нас</a>
            <button class="admin-open-btn" id="openAdminBtn">Админ-панель</button>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Лучшие цифровые товары и скрипты</h1>
            <p>Быстрая доставка, гарантия качества и поддержка 24/7</p>
            <a href="#catalog" class="btn-main">Перейти в каталог</a>
        </div>
    </section>

    <main class="container">
        <h2 id="catalog" class="section-title">Каталог товаров</h2>
        <div class="products-grid" id="productsContainer">
            </div>
    </main>

    <div class="admin-modal" id="adminModal">
        <div class="admin-modal-content">
            <h3>Управление магазином</h3>
            
            <div id="adminAuthBlock">
                <input type="password" id="adminPassword" placeholder="Введите пароль админа">
                <button class="save-product-btn" id="loginAdminBtn">Войти</button>
            </div>

            <div id="adminControlBlock" style="display: none;">
                <h4>Добавить новый товар</h4>
                <input type="text" id="newProdName" placeholder="Название товара">
                <input type="number" id="newProdPrice" placeholder="Цена (руб.)">
                <input type="text" id="newProdImg" placeholder="Ссылка на картинку">
                <textarea id="newProdDesc" placeholder="Описание товара" rows="3"></textarea>
                
                <div class="admin-modal-buttons">
                    <button class="save-product-btn" id="saveProductBtn">Сохранить</button>
                    <button class="close-admin-btn" id="closeAdminBtn">Закрыть</button>
                </div>

                <hr style="border: 1px solid #333; margin: 20px 0;">
                <h4>Текущие товары</h4>
                <div id="adminProductsList"></div>
            </div>
            
            <button class="close-admin-btn" id="closeAuthBtn" style="margin-top: 15px; width: 100%;">Закрыть</button>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Sky Store & OblakoTeam. Все права защищены.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
